# Ativação de Recursos Básicos no Zephyr RTOS
CONFIG_GPIO=y

# Console de diagnóstico no UART físico (Teensy pinos 0/RX1 e 1/TX1).
# O CDC ACM fica exclusivo para o protocolo do bridge e não recebe logs.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Logs de diagnóstico saem pelo UART físico. Reduzir os drivers USB/CAN a
# erros evita tráfego excessivo e recursão durante a enumeração USB.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_ERR=y
CONFIG_CAN_LOG_LEVEL_ERR=y

# Ativação da Pilha USB Device e CDC ACM (Virtual COM Port)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

# Descritores USB estáveis usados pela detecção automática no Windows.
# 1209:0001 é reservado por pid.codes APENAS para protótipos/testes privados.
# Antes de distribuir ou fabricar o produto, obtenha um PID próprio e atualize
# também boards/teensy41_bridge.json e tools/find_bridge_port.py.
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_MANUFACTURER="Blue Mechanic"
CONFIG_USB_DEVICE_PRODUCT="Azul Mecanico USB"
# No Zephyr 2.7, este texto define o comprimento do descritor. Em runtime ele
# é substituído por um identificador hexadecimal único obtido do i.MX RT1062.
CONFIG_USB_DEVICE_SN="BLUE_MECHANIC_0001"
CONFIG_USB_SELF_POWERED=n

# Ativação do Driver de CAN Bus (FlexCAN)
CONFIG_CAN=y
# O FlexCAN do i.MX RT1062 reserva o mailbox RX 0 por errata. São necessários
# quatro mailboxes configurados para obter os três filtros úteis do bridge.
CONFIG_CAN_MAX_FILTER=4

# Habilita suporte completo à biblioteca C (para usar sscanf, sprintf, etc.)
CONFIG_NEWLIB_LIBC=y
# MS/MSF recebem três valores decimais via sscanf("%f"). Sem esta opção, o
# newlib rejeita o comando antes que qualquer frame CAN seja transmitido.
CONFIG_NEWLIB_LIBC_FLOAT_SCANF=y

# Margem para o parser newlib, buffers USB e estruturas CAN na thread principal.
CONFIG_MAIN_STACK_SIZE=4096
# USB device e callbacks executam na system workqueue no Zephyr 2.7; reservar
# margem para controle e transferências CDC simultâneas.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
