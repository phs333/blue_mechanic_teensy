; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy @ 5.2.0
; O manifesto local adiciona o VID/PID do bridge para o PlatformIO localizar
; a porta COM correta, mesmo quando existem outros conversores seriais.
board = teensy41_bridge
framework = zephyr
; O uploader gráfico apenas abria o Teensy Loader e podia reportar sucesso sem
; gravar. O comando customizado usa o identificador TEENSY41 exigido pelo
; HalfKay desta placa e repete uma vez a primeira transferência, se necessário.
upload_protocol = custom
upload_command = powershell -NoProfile -ExecutionPolicy Bypass -File "$PROJECT_DIR/tools/upload_teensy.ps1" -HexPath "$SOURCE" -LoaderPath "$PROJECT_PACKAGES_DIR/tool-teensy/teensy_loader_cli.exe"
build_src_flags = -Wextra -Wshadow -Wformat=2 -Wno-unused-parameter
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

